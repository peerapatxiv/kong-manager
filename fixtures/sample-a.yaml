_format_version: "3.0"
consumers:
- username: alice
  custom_id: cust-1
  tags:
  - internal
  keyauth_credentials:
  - key: abc123key
plugins:
- name: rate-limiting
  enabled: true
  protocols:
  - http
  - https
  config:
    minute: 100
    policy: local
services:
- name: billing-service
  host: billing.internal
  port: 8080
  protocol: http
  connect_timeout: 60000
  read_timeout: 60000
  write_timeout: 60000
  retries: 5
  enabled: true
  tags:
  - billing
  routes:
  - name: billing-route
    hosts:
    - billing.example.com
    paths:
    - /billing
    protocols:
    - http
    - https
    strip_path: true
    preserve_host: false
    plugins:
    - name: key-auth
      enabled: true
      protocols:
      - http
      - https
      config:
        key_names:
        - apikey
- name: reporting-service
  host: reporting.internal
  port: 9090
  protocol: http
  connect_timeout: 60000
  read_timeout: 60000
  write_timeout: 60000
  retries: 5
  enabled: true
  routes:
  - name: reporting-route
    hosts:
    - reporting.example.com
    paths:
    - /reports
    protocols:
    - http
upstreams:
- name: billing-upstream
  algorithm: round-robin
