<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dark tile with a lime K, inset like other macOS app icons. The letter is the bright part
       so it stays readable when macOS darkens the icon for the Dark icon style. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#001A0D" />
  <text
    x="512"
    y="700"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="520"
    font-weight="700"
    fill="#C8FF00"
  >K</text>
</svg>
